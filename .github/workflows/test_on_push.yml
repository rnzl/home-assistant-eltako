name: Run unit tests

# also on pull_request: without it the unit tests do not gate a pull request at all -
# only hassfest and the hacs validation would run there
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pinned on purpose: '3.x' floats to whatever is newest and can break the build
          # without a change in this repository. Keep in sync with the python version home
          # assistant requires (see 'Requires-Python' of the homeassistant package).
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check custom_components tests

      - name: Run integration tests offline
        run: python -m tests.run_offline unittest discover tests -v

      - name: Run standalone tests offline
        run: python -m tests.run_offline pytest eltako_standalone/tests -q
